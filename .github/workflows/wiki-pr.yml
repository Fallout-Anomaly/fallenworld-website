name: Wiki PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/content/wiki/**"
      - "public/img/wiki/**"
      - "scripts/check-wiki.mjs"
      - "src/content.config.ts"
      - "src/pages/wiki/**"
      - "src/data/wiki.ts"
      - ".github/PULL_REQUEST_TEMPLATE/community-guide.md"
      - ".github/workflows/wiki-pr.yml"

permissions:
  contents: read

jobs:
  content-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Load trusted wiki validator
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          if git show "origin/${GITHUB_BASE_REF}:scripts/check-wiki.mjs" > /tmp/check-wiki.mjs 2>/dev/null; then
            echo "Using validator from ${GITHUB_BASE_REF}."
          else
            cp scripts/check-wiki.mjs /tmp/check-wiki.mjs
            echo "Base validator is not available yet; using this foundation PR's validator."
          fi

      - name: Validate wiki content without installing dependencies
        run: node /tmp/check-wiki.mjs

  trusted-full-build:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build and verify generated site
        run: npm run verify
