name: "npm audit"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        # --ignore-scripts blocks package lifecycle hooks, which are the vector
        # used by the npm worms that harvest CI credentials. Safe here: esbuild
        # 0.28.1 ships its platform binary as an optionalDependency, so it does
        # not need its postinstall to run. Do not add --omit=optional or
        # --no-optional alongside this, as that removes the binary and the
        # fallback that would fetch it.
        run: npm ci --ignore-scripts
      - name: Run npm audit
        run: |
          npm audit --json --audit-level=moderate > npm-audit-report.json || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            ./npm-audit-report.json
